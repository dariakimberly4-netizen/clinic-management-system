<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinic Command Center</title><link rel="stylesheet" href="style.css"></head><body>
<section id="login" class="screen center"><div class="login card"><div class="mark">✚</div><h1>CLINIC COMMAND CENTER</h1><p>Doctor + Clinic Staff</p><label>Account<select id="role"><option value="Doctor">DOCTOR</option><option value="Clinic Staff">CLINIC STAFF</option></select></label><label>PIN<input id="pin" inputmode="numeric" value="1234" maxlength="4"></label><button onclick="login()">ENTER SYSTEM</button><small>Demo PIN: 1234</small></div></section>
<section id="app" class="screen hidden"><header><div><b>✚ CLINIC COMMAND CENTER</b><span id="roleBadge"></span></div><button class="ghost" onclick="logout()">LOG OUT</button></header><main><section id="home"><div class="orbit-top"><p id="mode">LIVE CLINIC</p><h1 id="welcome">Clinic Command Center</h1></div><div id="modules" class="grid"></div></section><section id="workspace" class="hidden"><button class="back" onclick="home()">← BACK TO COMMAND CENTER</button><div id="content"></div></section></main></section><script src="app.js"></script></body></html>

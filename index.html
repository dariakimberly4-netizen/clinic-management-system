<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinic Command Center</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="login" class="screen center"><div class="login card"><div class="mark">✚</div><h1>CLINIC COMMAND CENTER</h1><p>Secure clinic workspace</p><label>Staff role<select id="role"><option>Admin</option><option>Receptionist</option><option>Doctor</option><option>Nurse</option><option>Pharmacist</option><option>Cashier</option><option>Inventory Staff</option></select></label><label>PIN<input id="pin" inputmode="numeric" value="1234" maxlength="4"></label><button onclick="login()">ENTER SYSTEM</button><small>Demo PIN: 1234</small></div></section>
<section id="app" class="screen hidden"><header><div><b>✚ CLINIC COMMAND CENTER</b><span id="roleBadge"></span></div><button class="ghost" onclick="logout()">LOG OUT</button></header>
<main><section id="home"><div class="hero"><p>LIVE OPERATIONS</p><h1>Clinic at a glance</h1><div class="stats"><div><strong id="sPatients">0</strong><span>Patients</span></div><div><strong id="sQueue">0</strong><span>Waiting</span></div><div><strong id="sAppt">0</strong><span>Appointments</span></div><div><strong id="sLow">0</strong><span>Low Stock</span></div></div></div><div id="modules" class="grid"></div></section>
<section id="workspace" class="hidden"><button class="back" onclick="home()">← BACK TO COMMAND CENTER</button><div id="content"></div></section></main></section>
<script src="app.js"></script></body></html>
